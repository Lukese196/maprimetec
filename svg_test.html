<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #888; display: flex; padding: 50px; gap: 50px; }
  svg { width: 300px; height: 300px; border: 1px solid red; }
</style>
</head>
<body>
  <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&display=swap');
        .box { fill: #1d1d1f; }
        .m { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 260px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
        .plus { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 250px; fill: #0071e3; text-anchor: end; dominant-baseline: hanging; }
      </style>
    </defs>
    <rect class="box" x="66" y="100" width="380" height="380" rx="100" />
    <text class="m" x="256" y="305">m</text>
    <text class="plus" x="496" y="20">+</text>
  </svg>
</body>
</html>
