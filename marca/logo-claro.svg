<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&amp;display=swap');
      .box { fill: #1d1d1f; }
      .m { font-family: 'DM Sans', Arial, sans-serif; font-weight: 700; font-size: 260px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .plus { font-family: 'DM Sans', Arial, sans-serif; font-weight: 700; font-size: 250px; fill: #0071e3; text-anchor: end; dominant-baseline: hanging; }
    </style>
  </defs>
  <g transform="translate(20, 20)">
    <rect class="box" x="50" y="140" width="380" height="380" rx="100" />
    <text class="m" x="240" y="325">m</text>
    <text class="plus" x="480" y="35">+</text>
  </g>
</svg>
