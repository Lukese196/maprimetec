<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin - MA PRIME TEC</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="admin.css">
  <script>
    const savedTheme = localStorage.getItem('mpt-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = savedTheme || (prefersDark ? 'dark' : 'light');
  </script>
</head>
<body>

  <!-- Tela de login -->
  <div id="login-screen" class="auth-screen" hidden>
    <div class="card auth-card">
      <h2>Acesso Restrito</h2>
      <p class="subtitle">Área de gerenciamento técnico</p>

      <button type="button" class="btn primary block" id="google-login-btn">
        <svg viewBox="0 0 24 24" fill="currentColor" class="u-icon" aria-hidden="true">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Entrar com Google
      </button>

      <p class="micro u-hidden" id="login-error" style="color:var(--danger)"></p>
    </div>
  </div>

  <!-- Painel -->
  <div id="dashboard" hidden>

    <header class="header-admin">
      <div class="header-admin-inner shell">
        <a class="brand" href="/" aria-label="Voltar ao site">
          <span class="brand-icon" aria-hidden="true">m<span>+</span></span>
          <span class="brand-text">
            MA PRIME <b>TEC</b>
            <small>PAINEL ADMIN</small>
          </span>
        </a>

        <div class="header-actions">
          <button type="button" id="theme-toggle" class="btn secondary icon" aria-label="Alternar tema" aria-pressed="false">☀️</button>
          <button type="button" id="logout" class="btn secondary">Sair</button>
        </div>
      </div>
    </header>

    <main class="u-wrapper shell" style="padding-block: var(--s4) var(--s6)">

      <div class="tab-list" role="tablist">
        <button class="tab" type="button" role="tab" aria-selected="true" data-target="tab-os">Ordens de serviço</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-target="tab-clients">Clientes</button>
      </div>

      <!-- Ordens de serviço -->
      <section id="tab-os" class="card tab-content" role="tabpanel">
        <div class="section-head">
          <h2>Ordens de serviço</h2>
          <button type="button" class="btn primary" id="btn-new-os" data-open="new-os-modal">+ Nova OS</button>
        </div>

        <div class="toolbar">
          <div class="search-field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="search-input" placeholder="Buscar por protocolo, cliente ou telefone..." aria-label="Buscar ordens de serviço">
            <div id="search-announcer" aria-live="polite" class="u-sr-only"></div>
          </div>

          <div id="filter-container" class="filter-bar">
            <button type="button" class="filter-btn" aria-pressed="true" data-filter="all">Todas <span class="count">0</span></button>
          </div>
        </div>

        <div class="list-scroll">
          <div id="os-list-container">
            <div class="empty-state"><div class="spinner"></div><p>Carregando...</p></div>
          </div>
        </div>
      </section>

      <!-- Clientes -->
      <section id="tab-clients" class="card tab-content" role="tabpanel" hidden>
        <div class="section-head">
          <h2>Clientes</h2>
          <button type="button" class="btn primary" id="btn-new-client" data-open="new-client-modal">+ Novo Cliente</button>
        </div>

        <div class="list-scroll">
          <div id="client-list">
            <div class="empty-state"><div class="spinner"></div><p>Carregando...</p></div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- Modal: editar OS -->
  <div id="edit-modal" class="modal-backdrop" hidden>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-protocol">

      <div class="modal-header">
        <h3>OS <span id="modal-protocol" style="color:var(--accent)"></span></h3>
        <button type="button" class="btn ghost icon" data-close="edit-modal" aria-label="Fechar">&times;</button>
      </div>

      <div class="modal-body">

        <div class="info-grid">
          <div class="full info-head">
            <div class="info-item">
              <span class="label">Cliente</span>
              <strong id="modal-client"></strong>
            </div>
            <button type="button" class="btn whatsapp" id="modal-whatsapp-btn">WhatsApp ↗</button>
          </div>
          <div class="info-item">
            <span class="label">Equipamento</span>
            <strong id="modal-device"></strong>
          </div>
          <div class="info-item">
            <span class="label">Telefone</span>
            <strong id="modal-phone"></strong>
          </div>
          <div class="info-item full">
            <span class="label">Problema relatado</span>
            <p id="modal-problem"></p>
          </div>
        </div>

        <form id="edit-form">
          <div class="form-group">
            <label class="field" for="edit-os-status">Status da ordem</label>
            <select id="edit-os-status" required></select>
          </div>

          <div class="form-group">
            <label class="field" for="os-budget">Valor do orçamento (R$)</label>
            <input type="number" step="0.01" min="0" id="os-budget" placeholder="0,00">
          </div>

          <div class="form-group">
            <label class="field" for="os-notes">Adicionar nota interna (opcional)</label>
            <textarea id="os-notes" placeholder="Ex: Peça encomendada..."></textarea>
          </div>

          <div class="form-group">
            <h4 class="field">Histórico</h4>
            <div id="modal-history" class="history-box"></div>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn secondary" data-close="edit-modal">Voltar</button>
            <div class="group">
              <button type="button" class="btn danger" id="cancel-os-btn">Cancelar OS</button>
              <button type="submit" class="btn primary">Salvar alterações</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: nova OS -->
  <div id="new-os-modal" class="modal-backdrop" hidden>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="new-os-title">
      <div class="modal-header">
        <h3 id="new-os-title">Nova ordem de serviço</h3>
        <button type="button" class="btn ghost icon" data-close="new-os-modal" aria-label="Fechar">&times;</button>
      </div>
      <div class="modal-body">
        <form id="new-os-form">

          <div class="form-group">
            <label class="field" for="new-os-client-select">Cliente *</label>
            <div style="display:flex; gap:var(--s2)">
              <select id="new-os-client-select" required>
                <option value="">Selecione um cliente</option>
              </select>
              <button type="button" class="btn secondary icon" data-open="new-client-modal" title="Novo cliente" aria-label="Novo cliente">+</button>
            </div>
          </div>

          <div class="form-row form-group">
            <div>
              <label class="field" for="new-device">Equipamento *</label>
              <select id="new-device" required>
                <option value="Notebook">Notebook</option>
                <option value="Computador">Computador</option>
                <option value="Impressora">Impressora</option>
                <option value="Outro">Outro</option>
              </select>
            </div>
            <div>
              <label class="field" for="new-model">Modelo / Marca</label>
              <input type="text" id="new-model" placeholder="Opcional">
            </div>
          </div>

          <div class="form-group">
            <label class="field" for="new-problem">Problema relatado *</label>
            <textarea id="new-problem" required placeholder="Descreva o problema da máquina..."></textarea>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn secondary" data-close="new-os-modal">Cancelar</button>
            <div class="group">
              <button type="submit" class="btn primary">Criar OS</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: novo cliente -->
  <div id="new-client-modal" class="modal-backdrop" hidden>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="new-client-title">
      <div class="modal-header">
        <h3 id="new-client-title">Novo cliente</h3>
        <button type="button" class="btn ghost icon" data-close="new-client-modal" aria-label="Fechar">&times;</button>
      </div>
      <div class="modal-body">
        <form id="new-client-form">
          <div class="form-group">
            <label class="field" for="new-cli-name">Nome completo *</label>
            <input type="text" id="new-cli-name" required placeholder="Ex: João Silva" autocomplete="name">
          </div>

          <div class="form-row form-group">
            <div>
              <label class="field" for="new-cli-cpf">CPF / CNPJ *</label>
              <input type="text" id="new-cli-cpf" required placeholder="Apenas números" inputmode="numeric">
            </div>
            <div>
              <label class="field" for="new-cli-phone">WhatsApp *</label>
              <input type="tel" id="new-cli-phone" required placeholder="DDD + Número" inputmode="tel">
            </div>
          </div>

          <div class="form-group">
            <label class="field" for="new-cli-address">Endereço</label>
            <input type="text" id="new-cli-address" placeholder="Rua, número, bairro">
          </div>

          <div class="form-group">
            <label class="field" for="new-cli-email">E-mail</label>
            <input type="email" id="new-cli-email" placeholder="cliente@email.com" autocomplete="email">
          </div>

          <div class="modal-actions">
            <button type="button" class="btn secondary" data-close="new-client-modal">Cancelar</button>
            <div class="group">
              <button type="submit" class="btn primary">Salvar cliente</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
