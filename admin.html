<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - MA PRIME TEC</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: var(--surface); }
    .admin-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }
    .card {
      background: var(--bg);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid var(--line);
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }
    .os-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .os-table th {
      padding: 16px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--line);
    }
    .os-table td {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      vertical-align: top;
    }
    .os-table tr:hover {
      background: var(--surface);
    }
    .os-table tr:last-child td { border-bottom: none; }
    
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      color: white;
    }

    #login-screen {
      max-width: 400px;
      margin: 100px auto;
      text-align: center;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center;
      z-index: 100;
      opacity: 1;
      transition: opacity 0.2s;
    }
    .modal {
      background: var(--bg);
      border-radius: 24px;
      width: 100%;
      max-width: 550px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      transform: translateY(0);
      transition: transform 0.2s;
    }
    .modal h3 { margin-top: 0; font-size: 24px; }
    .hidden { display: none !important; opacity: 0; pointer-events: none; }
    .modal-backdrop.hidden .modal { transform: translateY(20px); }

    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }
    
    .mascot-login {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      background: var(--surface);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <div id="login-screen" class="card">
    <div class="mascot-login">
      <img src="marca/variacoes/atento.svg" alt="Admin" style="width: 80px;">
    </div>
    <h2 style="margin-top: 0;">Acesso Restrito</h2>
    <p class="subtitle">Área de gerenciamento técnico</p>
    <form id="login-form">
      <label class="field" for="password" style="text-align: left;">Senha de Acesso</label>
      <input type="password" id="password" required>
      <button type="submit" class="primary" style="width: 100%; margin-top: 24px;">Acessar Painel</button>
    </form>
    <p class="micro" style="margin-top: 20px;">Dica: a senha é admin123</p>
  </div>

  <div id="dashboard" class="admin-container hidden">
    <div class="header">
      <div>
        <a class="brand" href="/" aria-label="Voltar ao site">
          <span class="brand-icon">m<span>+</span></span>
          <span>MA PRIME <b>TEC</b><small>PAINEL ADMIN</small></span>
        </a>
      </div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <span class="micro">Bem-vindo, Administrador</span>
        <button class="text-button" id="logout" style="min-height: auto; padding: 8px 16px; border: 1px solid var(--line); border-radius: 99px;">Sair</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 20px;">
        <h2 style="margin: 0; font-size: 28px;">Ordens de Serviço</h2>
        
        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all">Todas</button>
          <button class="filter-btn" data-filter="Aberto">Abertas</button>
          <button class="filter-btn" data-filter="Em Reparo">Em Reparo</button>
          <button class="filter-btn" data-filter="Finalizado">Finalizadas</button>
        </div>
      </div>
      
      <div style="overflow-x: auto;">
        <table class="os-table">
          <thead>
            <tr>
              <th>Protocolo</th>
              <th>Cliente</th>
              <th>Equipamento</th>
              <th>Status</th>
              <th>Atualização</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="os-list">
            <!-- OS rows -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="edit-modal" class="modal-backdrop hidden">
    <div class="modal" id="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h3>OS <span id="modal-protocol" style="color: var(--blue);"></span></h3>
        <button class="text-button" id="close-modal-x" style="min-height:auto; font-size:24px; padding:0;">×</button>
      </div>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; font-size: 14px; background: var(--surface); padding: 20px; border-radius: 16px;">
        <div>
          <span style="color: var(--muted); display: block; font-size: 12px;">Cliente</span>
          <strong id="modal-client"></strong>
        </div>
        <div>
          <span style="color: var(--muted); display: block; font-size: 12px;">Equipamento</span>
          <strong id="modal-device"></strong>
        </div>
        <div style="grid-column: 1 / -1;">
          <span style="color: var(--muted); display: block; font-size: 12px;">Problema Relatado</span>
          <span id="modal-problem"></span>
        </div>
      </div>

      <form id="edit-form">
        <label class="field">Status da Ordem</label>
        <select id="os-status" style="width:100%; padding:16px; border:1px solid var(--line); border-radius:14px; background:var(--bg); font-size:16px; cursor: pointer;">
          <option value="Aberto">Aberto</option>
          <option value="Em Análise">Em Análise</option>
          <option value="Orçamento Enviado">Orçamento Enviado</option>
          <option value="Em Reparo">Em Reparo</option>
          <option value="Finalizado">Finalizado</option>
          <option value="Cancelado">Cancelado</option>
        </select>
        
        <label class="field" style="margin-top: 20px;">Notas Técnicas Internas</label>
        <textarea id="os-notes" placeholder="Ex: Tela trocada, valor do orçamento R$ 250, aguardando peça..." style="min-height: 100px; background:var(--bg);"></textarea>
        
        <div style="display:flex; gap:12px; margin-top:30px; justify-content: flex-end;">
          <button type="button" class="text-button" id="close-modal">Cancelar</button>
          <button type="submit" class="primary">Salvar Status</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentOS = null;
    let osDataList = [];
    let activeFilter = 'all';

    const statusColors = {
      'Aberto': 'var(--blue)',
      'Em Análise': '#f59e0b',
      'Orçamento Enviado': '#8b5cf6',
      'Em Reparo': '#3b82f6',
      'Finalizado': 'var(--green)',
      'Cancelado': '#ef4444'
    };

    const loginScreen = document.getElementById('login-screen');
    const dashboard = document.getElementById('dashboard');
    
    if (localStorage.getItem('ma_admin_logged') === 'true') {
      loginScreen.classList.add('hidden');
      dashboard.classList.remove('hidden');
      loadOS();
    }

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (document.getElementById('password').value === 'admin123') {
        localStorage.setItem('ma_admin_logged', 'true');
        loginScreen.classList.add('hidden');
        dashboard.classList.remove('hidden');
        loadOS();
      } else {
        alert('Senha incorreta. Tente admin123.');
      }
    });

    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('ma_admin_logged');
      location.reload();
    });

    // Filtering
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        activeFilter = e.target.dataset.filter;
        renderTable();
      });
    });

    function loadOS() {
      osDataList = JSON.parse(localStorage.getItem('maprime_os_list') || '[]');
      osDataList.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('os-list');
      
      const filtered = activeFilter === 'all' 
        ? osDataList 
        : osDataList.filter(os => os.status === activeFilter);

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 60px 20px; color: var(--muted);"><img src="marca/variacoes/duvida.svg" width="80" style="margin-bottom:10px;"><br>Nenhuma OS encontrada.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(os => `
        <tr>
          <td><strong style="color:var(--text);">${os.protocol}</strong></td>
          <td>
            <b>${os.client}</b>
            ${os.notes ? `<span style="display:block; font-size:11px; color:var(--muted); margin-top:4px; max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">📝 ${os.notes}</span>` : ''}
          </td>
          <td>${os.device}<br><small style="color:var(--muted)">${os.model || ''}</small></td>
          <td>
            <span class="status-badge" style="background: ${statusColors[os.status] || '#999'}">
              ${os.status}
            </span>
          </td>
          <td style="color:var(--muted); font-size:12px;">
            ${new Date(os.updatedAt).toLocaleDateString('pt-BR')}
          </td>
          <td>
            <button class="primary" onclick="openEdit('${os.protocol}')" style="min-height: auto; padding: 10px 16px; font-size:13px; border-radius:10px;">Gerenciar</button>
          </td>
        </tr>
      `).join('');
    }

    // Modal
    const modal = document.getElementById('edit-modal');
    
    window.openEdit = (protocol) => {
      currentOS = osDataList.find(o => o.protocol === protocol);
      if (!currentOS) return;
      
      document.getElementById('modal-protocol').textContent = protocol;
      document.getElementById('modal-client').textContent = currentOS.client;
      document.getElementById('modal-device').textContent = `${currentOS.device} ${currentOS.model ? '('+currentOS.model+')' : ''}`;
      document.getElementById('modal-problem').textContent = currentOS.problem;
      
      document.getElementById('os-status').value = currentOS.status;
      document.getElementById('os-notes').value = currentOS.notes || '';
      
      modal.classList.remove('hidden');
    };

    const closeModal = () => modal.classList.add('hidden');
    document.getElementById('close-modal').addEventListener('click', closeModal);
    document.getElementById('close-modal-x').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.getElementById('edit-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      currentOS.status = document.getElementById('os-status').value;
      currentOS.notes = document.getElementById('os-notes').value;
      currentOS.updatedAt = new Date().toISOString();
      
      localStorage.setItem('maprime_os_list', JSON.stringify(osDataList));
      closeModal();
      loadOS();
    });
  </script>
</body>
</html>
