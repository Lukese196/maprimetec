<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Assistência de informática MA PRIME TEC. Conte o que aconteceu com seu equipamento e prepare seu atendimento pelo WhatsApp.">
  <title>MA PRIME TEC · Vamos cuidar da sua tecnologia</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('ma-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}</script>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar" style="view-transition-name: topbar;">
    <a class="brand" href="#inicio" aria-label="MA PRIME TEC — início"><span class="brand-icon" aria-hidden="true">m<span>+</span></span><span>MA PRIME <b>TEC</b><small>ASSISTÊNCIA DE INFORMÁTICA</small></span></a>
    <button id="theme" class="theme-button" type="button" aria-label="Ativar tema escuro"></button>
  </header>
  <div id="progress" class="progress-container" style="opacity: 0; visibility: hidden; transition: opacity var(--d-in) var(--ease), visibility var(--d-in) var(--ease); view-transition-name: progress;">
    <div class="progress-track" aria-hidden="true"><div id="progress-bar" class="progress-fill"></div></div>
    <div id="progress-label" class="progress-label"></div>
  </div>
  <main id="app"></main>
  <noscript><p class="noscript">Ative o JavaScript para responder às perguntas da triagem.</p></noscript>
  <footer><span>MA PRIME TEC</span><span>Tecnologia com cuidado humano.</span></footer>
</body>
</html>
